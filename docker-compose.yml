services:
  postgres:
    image: postgres:16-alpine
    container_name: sysfortech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sysfortech
      POSTGRES_PASSWORD: sysfortech_local_pw
      POSTGRES_DB: sysfortech_dev
    ports:
      - "5432:5432"
    volumes:
      - sysfortech_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysfortech -d sysfortech_dev"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  sysfortech_pgdata:
